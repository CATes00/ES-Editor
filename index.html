<style>
:root{--bg:#f3f3ef;--fg:#121212;--card:#fff;--line:#dcdcd4;--acc:#f5c400;--accfg:#111;--mut:#6b6b66;--bad:#c01f1f;--ok:#17803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f11;--fg:#f2f2ee;--card:#17191c;--line:#2c2f34;--mut:#9a9a94;--bad:#ff7b7b;--ok:#5be08a}}
:root[data-theme="dark"]{--bg:#0e0f11;--fg:#f2f2ee;--card:#17191c;--line:#2c2f34;--mut:#9a9a94;--bad:#ff7b7b;--ok:#5be08a}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:12px;max-width:900px}
.hd{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--acc);border-radius:12px}
.hd img{width:48px;height:48px;border-radius:10px;border:1px solid var(--line)}
.ti{flex:1;font-size:17px;letter-spacing:.5px;text-transform:uppercase;font-weight:800;line-height:1.1}.ti span{display:block;font-weight:500;font-size:12px;color:var(--mut);letter-spacing:1px}
.ctl{display:flex;gap:6px}
h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
button,select,input,textarea,.btn{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;max-width:100%}
button,.btn{background:var(--acc);color:var(--accfg);border:0;font-weight:700;cursor:pointer;display:inline-block}
button:disabled{opacity:.4;cursor:default}
button.alt,.btn.alt{background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
input[type=color]{padding:0;width:44px;height:34px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px}
.it{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.it.sel{background:var(--acc);color:var(--accfg);font-weight:600}.it.sel .mut{color:var(--accfg)}
.f{display:grid;grid-template-columns:minmax(90px,35%) 1fr;gap:6px;align-items:center;margin:4px 0}
.f input[type=number],.f input[type=text]{width:100%}
fieldset{border:1px solid var(--line);border-radius:9px;margin:8px 0;padding:6px 10px}legend{color:var(--mut);font-size:13px}
</style>
</head>

/* Минимальный LZMA: полный декодер + кодер только из литералов (без поиска совпадений) */
function lzmaDecode(props,src,usize){
  let b=props[0],lc=b%9;b=(b/9)|0;const lp=b%5,pb=(b/5)|0;
  const mk=n=>new Uint16Array(n).fill(1024);
  const IsMatch=mk(192),IsRep=mk(12),G0=mk(12),G1=mk(12),G2=mk(12),R0L=mk(192);
  const Slot=[mk(64),mk(64),mk(64),mk(64)],Pos=mk(115),Align=mk(16),Lit=mk(0x300<<(lc+lp));
  const mkLen=()=>({c:mk(1),c2:mk(1),lo:Array.from({length:16},()=>mk(8)),mi:Array.from({length:16},()=>mk(8)),hi:mk(256)});
  const LenD=mkLen(),RepD=mkLen();
  let ip=5,range=0xFFFFFFFF,code=((src[1]<<24)|(src[2]<<16)|(src[3]<<8)|src[4])>>>0;
  const norm=()=>{if(range<0x1000000){range=(range<<8)>>>0;code=((code<<8)|(src[ip++]||0))>>>0}};
  const bit=(p,i)=>{const v=p[i],bd=(range>>>11)*v;let r;
    if(code<bd){range=bd;p[i]=v+((2048-v)>>5);r=0}else{range-=bd;code-=bd;p[i]=v-(v>>5);r=1}norm();return r};
  const tree=(p,n,o=0)=>{let m=1;for(let i=0;i<n;i++)m=(m<<1)|bit(p,o+m);return m-(1<<n)};
  const rtree=(p,n,o=0)=>{let m=1,s=0;for(let i=0;i<n;i++){const x=bit(p,o+m);m=(m<<1)|x;s|=x<<i}return s};
  const direct=n=>{let r=0;for(let i=0;i<n;i++){range>>>=1;code=(code-range)>>>0;const t=(code>>>31)?1:0;if(t)code=(code+range)>>>0;norm();r=((r<<1)|(t?0:1))>>>0}return r};
  const len=(d,ps)=>{if(!bit(d.c,0))return tree(d.lo[ps],3);if(!bit(d.c2,0))return 8+tree(d.mi[ps],3);return 16+tree(d.hi,8)};
  const out=new Uint8Array(usize);let pos=0,st=0,r0=0,r1=0,r2=0,r3=0;
  while(pos<usize){
    const ps=pos&((1<<pb)-1);
    if(!bit(IsMatch,(st<<4)+ps)){
      const prev=pos?out[pos-1]:0,base=0x300*(((pos&((1<<lp)-1))<<lc)+(prev>>(8-lc)));let s=1;
      if(st>=7){let mb=out[pos-r0-1];do{const m=(mb>>7)&1;mb<<=1;const x=bit(Lit,base+((1+m)<<8)+s);s=(s<<1)|x;if(m!==x)break}while(s<0x100)}
      while(s<0x100)s=(s<<1)|bit(Lit,base+s);
      out[pos++]=s&255;st=st<4?0:st<10?st-3:st-6;continue}
    let L;
    if(!bit(IsRep,st)){
      r3=r2;r2=r1;r1=r0;L=len(LenD,ps);st=st<7?7:10;

let S=null,rootIdx=0,sel=-1,built=null,dirty=false,L=ls.get('lang');
if(!T[L]){const n=(navigator.language||'en').slice(0,2).toLowerCase();L=T[n]?n:n==='nb'||n==='nn'?'no':'en'}
const t=i=>T[L][i];
const status=(x,c)=>{$('status').textContent=x;$('status').className=c||'mut'};
const msg=(x,c)=>{$('msg').textContent=x;$('msg').className=c||'mut'};
const nm=x=>NAMES[x]||('#'+x);
const roots=()=>[S.save.GroundRoot,...(S.save.DynamicRoots||[])];
const rlabel=i=>(i===0?t(7):t(8)+' '+i)+' ('+(roots()[i].Multiblocks||[]).length+')';

function applyI18n(){
  document.documentElement.lang=L==='pt'?'pt-BR':L;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(+e.dataset.i));
  $('q').placeholder=t(6);setBtns();
  if(!S)status(t(1));else{const o=$('root'),v=o.value;o.replaceChildren(...roots().map((_,i)=>new Option(rlabel(i),i)));o.value=v;list()}
}
$('lang').replaceChildren(...LN.map(([c,n])=>new Option(n,c)));$('lang').value=L;
$('lang').onchange=()=>{L=$('lang').value;ls.set('lang',L);applyI18n()};
const themes=['auto','light','dark'],icons={auto:'🌓',light:'☀️',dark:'🌙'};let th=ls.get('theme')||'auto';
function setTheme(){const r=document.documentElement;th==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',th);$('th').textContent=icons[th]}
$('th').onclick=()=>{th=themes[(themes.indexOf(th)+1)%3];ls.set('theme',th);setTheme()};

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const r=readSave(new Uint8Array(await f.arrayBuffer()));S={save:r.save,kind:r.kind,name:f.name};start(f.name+': '+t(2))}
  catch(err){status(t(3)+': '+err.message,'bad')}};
$('jf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{S={save:JSON.parse(await f.text()),kind:1,name:f.name.replace(/\.json$/,'.etsave7')};start(f.name)}catch(err){status(t(3)+': '+err.message,'bad')}};
function start(x){built=null;dirty=false;msg('');status(x,'ok');$('app').hidden=false;rootIdx=0;sel=-1;
  $('root').replaceChildren(...roots().map((_,i)=>new Option(rlabel(i),i)));$('root').value=0;
  $('world').replaceChildren();gen($('world'),S.save,['MapName','CustomMapName','UseDefaultSpawn','PlayerPosition','PlayerRotation','InDriverSeat']);
  list();$('edCard').hidden=true;rootForm();setBtns()}
$('root').onchange=()=>{rootIdx=+$('root').value;sel=-1;list();$('edCard').hidden=true;rootForm()};
$('q').oninput=list;

function list(){
  const bl=roots()[rootIdx].Multiblocks||[],q=$('q').value.toLowerCase(),box=$('list');box.replaceChildren();let n=0;
  bl.forEach((b,i)=>{const x=nm(b.ItemType);if(q&&!x.toLowerCase().includes(q))return;n++;
    const d=document.createElement('div');d.className='it'+(i===sel?' sel':'');d.innerHTML='<span></span><span class="mut"></span>';
    const p=b.Position||{};d.children[0].textContent=i+'. '+x;d.children[1].textContent=[p.x,p.y,p.z].map(v=>typeof v==='number'?+v.toFixed(2):v).join(' ');
    d.onclick=()=>{sel=i;list();edit()};box.appendChild(d)});
  $('cnt').textContent='('+n+' / '+bl.length+')'}
function edit(){
  const b=roots()[rootIdx].Multiblocks[sel],ed=$('ed');ed.replaceChildren();$('edCard').hidden=false;
  $('edT').textContent=sel+'. '+nm(b.ItemType)+' · ItemType '+b.ItemType;
  gen(ed,b,['ItemType','IsGrounded','HalfCubeMask','Position','Rotation']);
  (b.Colors||[]).forEach((c,i)=>ed.appendChild(colorRow(c,t(9)+' '+(i+1))));
  const skip=new Set(['Origin','GUID','ItemType','IsGrounded','HalfCubeMask','Position','Rotation','Colors']);
  gen(ed,b,Object.keys(b).filter(k=>!skip.has(k)&&b[k]!==null&&!(Array.isArray(b[k])&&!b[k].length)));
  const g=document.createElement('div');g.className='mut';g.textContent='GUID: '+b.GUID;ed.appendChild(g)}
function rootForm(){const r=roots()[rootIdx],box=$('rootEd');box.replaceChildren();
  gen(box,r,Object.keys(r).filter(k=>!['Multiblocks','Bearings','Origin','GUID'].includes(k)&&r[k]!==null&&!(Array.isArray(r[k])&&!r[k].length)))}

const h2x=v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0');
function colorRow(c,label){
  const d=document.createElement('div'),l=document.createElement('span'),w=document.createElement('div'),i=document.createElement('input'),a=document.createElement('input');d.className='f';
  l.textContent=label;w.className='row';i.type='color';i.value='#'+h2x(c.r)+h2x(c.g)+h2x(c.b);
  i.oninput=()=>{const v=i.value;c.r=parseInt(v.substr(1,2),16)/255;c.g=parseInt(v.substr(3,2),16)/255;c.b=parseInt(v.substr(5,2),16)/255};
  a.type='number';a.step='any';a.min=0;a.max=1;a.value=c.a;a.style.width='80px';a.title='alpha';a.onchange=()=>{c.a=parseFloat(a.value)};
  w.append(i,a);d.append(l,w);return d}
function gen(box,obj,keys){
  for(const k of keys){const v=obj[k];if(v===undefined||v===null)continue;
    if(typeof v==='object'&&!Array.isArray(v)){const fs=document.createElement('fieldset'),lg=document.createElement('legend');lg.textContent=k;fs.appendChild(lg);gen(fs,v,Object.keys(v));box.appendChild(fs);continue}
    const d=document.createElement('div');d.className='f';const l=document.createElement('span');l.textContent=k;let i=document.createElement('input');
    if(typeof v==='boolean'){i.type='checkbox';i.checked=v;i.onchange=()=>{obj[k]=i.checked}}
    else if(typeof v==='number'){i.type='number';i.step='any';i.value=v;i.onchange=()=>{const x=parseFloat(i.value);if(!isNaN(x))obj[k]=x}}
    else if(typeof v==='string'){i.type='text';i.value=v;i.onchange=()=>{obj[k]=i.value}}
    else{i.type='text';i.value=JSON.stringify(v);i.onchange=()=>{try{obj[k]=JSON.parse(i.value);i.style.borderColor=''}catch{i.style.borderColor='var(--bad)'}}}
    d.append(l,i);box.appendChild(d)}}

function dl(bytes,fn){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes]));a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function setBtns(){$('dl').disabled=!built||dirty;$('sv').textContent=t(10)+(dirty?' •':'')}
$('app').addEventListener('change',()=>{if(built){dirty=true;setBtns();msg(t(15))}});
$('sv').onclick=()=>{try{built=writeSave(S.save,S.kind);dirty=false;setBtns();msg(t(14)+' ('+built.length+' B)','ok')}catch(e){msg(t(3)+': '+e.message,'bad')}};
$('dl').onclick=async()=>{
  const name=S.name.replace(/(\.etsave7)?$/,'_edited.etsave7');
  if(window.showSaveFilePicker){
    try{const fh=await showSaveFilePicker({suggestedName:name,types:[{description:'Evertech',accept:{'application/octet-stream':['.etsave7']}}]});
      const w=await fh.createWritable();await w.write(built);await w.close();msg(t(16)+': '+fh.name,'ok');return}
    catch(e){if(e.name==='AbortError'){msg(t(17));return}}}
  dl(built,name);msg(t(18),'ok')};
$('dlj').onclick=()=>dl(JSON.stringify(S.save,null,2),S.name.replace(/\.etsave7$/,'')+'.json');
setTheme();applyI18n();
</script>
</body>
</html>
