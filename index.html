<style>
:root{--bg:#f3f3ef;--fg:#121212;--card:#fff;--line:#dcdcd4;--acc:#f5c400;--accfg:#111;--mut:#6b6b66;--bad:#c01f1f;--ok:#17803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f11;--fg:#f2f2ee;--card:#17191c;--line:#2c2f34;--mut:#9a9a94;--bad:#ff7b7b;--ok:#5be08a}}
:root[data-theme="dark"]{--bg:#0e0f11;--fg:#f2f2ee;--card:#17191c;--line:#2c2f34;--mut:#9a9a94;--bad:#ff7b7b;--ok:#5be08a}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:12px;max-width:900px}
.hd{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--acc);border-radius:12px}
.hd img{width:48px;height:48px;border-radius:10px;border:1px solid var(--line)}
.ti{flex:1;font-size:17px;letter-spacing:.5px;text-transform:uppercase;font-weight:800;line-height:1.1}.ti span{display:block;font-weight:500;font-size:12px;color:var(--mut);letter-spacing:1px}
.ctl{display:flex;gap:6px}
h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
button,select,input,textarea,.btn{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;max-width:100%}
button,.btn{background:var(--acc);color:var(--accfg);border:0;font-weight:700;cursor:pointer;display:inline-block}
button:disabled{opacity:.4;cursor:default}
button.alt,.btn.alt{background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
input[type=color]{padding:0;width:44px;height:34px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px}
.it{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.it.sel{background:var(--acc);color:var(--accfg);font-weight:600}.it.sel .mut{color:var(--accfg)}
.f{display:grid;grid-template-columns:minmax(90px,35%) 1fr;gap:6px;align-items:center;margin:4px 0}
.f input[type=number],.f input[type=text]{width:100%}
.on{background:var(--acc)!important;color:var(--accfg)!important;border:0!important}.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}.pb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;line-height:1.1;word-break:break-all}.pb img{width:44px;height:44px}
.lbl{font-size:12px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}.hint{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:8px 0;font-size:13px;white-space:pre-line}.sw{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);padding:0;cursor:pointer}
.fsm{position:fixed;inset:0;z-index:100;margin:0!important;border-radius:0;display:flex;flex-direction:column;padding-top:max(env(safe-area-inset-top),10px);overflow:hidden}.fsm canvas{flex:1;min-height:0;height:auto!important}.fsm #tools{max-height:40vh;overflow:auto}.hid{display:none}
summary{cursor:pointer;font-weight:600;padding:6px 0}details{border-top:1px solid var(--line);margin-top:6px}
fieldset{border:1px solid var(--line);border-radius:9px;margin:8px 0;padding:6px 10px}legend{color:var(--mut);font-size:13px}
</style>
</head>

/* Минимальный LZMA: полный декодер + кодер только из литералов (без поиска совпадений) */

  const tree=(p,n,o=0)=>{let m=1;for(let i=0;i<n;i++)m=(m<<1)|bit(p,o+m);return m-(1<<n)};

    let L;

      const ls=L<4?L:3,slot=tree(Slot[ls],6);

      if(r0===0xFFFFFFFF)break;
    }else{

      if(!bit(G0,st)){if(!bit(R0L,(st<<4)+ps)){st=st<7?9:11;out[pos]=out[pos-r0-1];pos++;continue}}
      else{let d;if(!bit(G1,st))d=r1;else{if(!bit(G2,st))d=r2;else{d=r3;r3=r2}r2=r1}r1=r0;r0=d}

/* Кодер: каждый байт — литерал (lc=3, lp=0, pb=2). Файл получается чуть больше оригинала, но валидный. */
function lzmaEncodeLiterals(data){

  const shift=()=>{if(low<0xFF000000||low>=0x100000000){const c=low>=0x100000000?1:0;let t=cache;do{out.push((t+c)&255);t=0xFF}while(--cs!==0);cache=Math.floor(low/0x1000000)&255}cs++;low=(low%0x1000000)*256};
  const enc=(p,i,b)=>{const v=p[i],bd=(range>>>11)*v;
    if(!b){range=bd;p[i]=v+((2048-v)>>5)}else{low+=bd;range-=bd;p[i]=v-(v>>5)}
    while(range<0x1000000){range=(range<<8)>>>0;shift()}};

  for(let pos=0;pos<data.length;pos++){
    enc(IsMatch,pos&3,0);
    const prev=pos?data[pos-1]:0,base=0x300*(prev>>5),c=data[pos];let s=1;
    for(let i=7;i>=0;i--){const b=(c>>i)&1;enc(Lit,base+s,b);s=(s<<1)|b}
  }
  for(let i=0;i<5;i++)shift();

}

const MISSING=Symbol('missing');
function guidStr(b){const h=i=>b[i].toString(16).padStart(2,'0');

class Writer{

  d.children[0].textContent=bp.name+' · '+bp.blocks.length;const w=d.children[1];
  [['⤓',()=>bpPaste(bp)],['⬇',()=>dl(JSON.stringify(bp),(bp.name||'blueprint')+'.etbp.json')],['🗑',()=>{a.splice(i,1);bpStore(a);bpList()}]].forEach(([t,f])=>{const b=document.createElement('button');b.className='alt';b.textContent=t;b.onclick=f;w.appendChild(b)});box.appendChild(d)})}
function pngBp(u8){const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let o=8;
  while(o+12<=u8.length){const n=dv.getUint32(o),ty=String.fromCharCode(...u8.subarray(o+4,o+8));
    if(ty==='etSb'){const ch=u8.subarray(o+8,o+8+n);if(String.fromCharCode(...ch.subarray(0,5))!=='ETSB\u0001')throw new Error('etSb ?');
      if(crc32(u8.subarray(o+4,o+8+n))!==dv.getUint32(o+8+n))throw new Error('PNG CRC');return ch.subarray(8)}o+=n+12}
  throw new Error('PNG: etSb ?')}
$('bpf').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const u8=new Uint8Array(await f.arrayBuffer()),nm0=f.name.replace(/\.[^.]+$/,'');let bp;
    if(u8[0]===0x7b){bp=JSON.parse(new TextDecoder().decode(u8));if(bp.format!=='etbp')throw new Error('JSON ?')}
    else{const sv=readSave(u8[0]===0x89?pngBp(u8):u8).save;bp=bpMake([sv.GroundRoot,...(sv.DynamicRoots||[])].filter(Boolean).flatMap(r=>r.Multiblocks||[]),nm0)}
    bpAdd(bp)}catch(err){msg(t(3)+': '+err.message,'bad')}};
/* выбор по условию */
function selectBy(fn){const add=$('qadd').checked,s=add?new Set(selSet()):new Set();let last=-1;mbs().forEach((b,i)=>{if(fn(b)){s.add(i);last=i}});
  ms=s;sel=last>=0?last:(add?sel:-1);$('qcnt').textContent=hh(60)+': '+s.size;list();if(sel>=0)edit();else $('edCard').hidden=true;draw3()}
const colFn=()=>{const c0=hx2($('qc').value),tol=num('qtol')/100*3,gr=$('qgray').checked;return b=>{const c=(b.Colors||[])[0];if(!c)return false;
  return gr?Math.max(c.r,c.g,c.b)-Math.min(c.r,c.g,c.b)<.08:Math.abs(c.r-c0[0])+Math.abs(c.g-c0[1])+Math.abs(c.b-c0[2])<=tol}};
$('qst').onclick=()=>{const t0=+$('qt').value;selectBy(b=>b.ItemType===t0)};
$('qlt').onclick=()=>{const b0=cur();if(b0){const t0=b0.ItemType;$('qt').value=t0;selectBy(b=>b.ItemType===t0)}};
$('qsc').onclick=()=>selectBy(colFn());
$('qlc').onclick=()=>{const c=((cur()||{}).Colors||[])[0];if(!c)return;$('qc').value='#'+h2x(c.r)+h2x(c.g)+h2x(c.b);$('qgray').checked=false;selectBy(colFn())};
$('qrep').onclick=()=>{const t0=+$('qrt').value,bs=selBl().filter(isSimple);if(!bs.length)return;snap();bs.forEach(b=>{b.ItemType=t0});after()};
/* статистика */
function stats(){const R=roots(),bl=R[rootIdx].Multiblocks||[],tot=R.reduce((s,r)=>s+(r.Multiblocks||[]).length,0),cnt={},cc={},mn=[1e18,1e18,1e18],mx=[-1e18,-1e18,-1e18];
  for(const b of bl){cnt[b.ItemType]=(cnt[b.ItemType]||0)+1;if(b.Position)['x','y','z'].forEach((k,i)=>{const v=b.Position[k];if(v<mn[i])mn[i]=v;if(v>mx[i])mx[i]=v});
    const c=(b.Colors||[])[0];if(c){const k='#'+h2x(c.r)+h2x(c.g)+h2x(c.b);cc[k]=(cc[k]||0)+1}}
  const st=bsize(),L=[rlabel(rootIdx)+': '+bl.length+'   Σ '+tot+' ('+R.length+')'];
  if(bl.length){L.push('XYZ: '+mn.map((v,i)=>Math.round((mx[i]-v)/st)+1).join(' × ')+'   ('+mn.map((v,i)=>v.toFixed(2)+'…'+mx[i].toFixed(2)).join(' | ')+')');L.push('center: '+mn.map((v,i)=>((v+mx[i])/2).toFixed(2)).join(', '))}
  L.push('');Object.entries(cnt).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>L.push(String(n).padStart(7)+'  '+nm(+k)+' ('+k+')'));
  L.push('');Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([k,n])=>L.push(String(n).padStart(7)+'  '+k));$('stt').textContent=L.join('\n')}
$('sbtn').onclick=stats;$('dSt').ontoggle=()=>{if($('dSt').open)stats()};
$('scp').onclick=()=>{try{navigator.clipboard.writeText($('stt').textContent)}catch{}};
bpList();
/* ===== v5: физика и 3D-модель → плитки ===== */
const DTPL={"Bearings": [], "LocalJoints": [], "MultiblocksAttachedToBearingGUIDs": [], "SuspensionSecondBaseGUIDs": [], "PistonSecondBaseRefGUIDs": [], "Joint": null, "MultiblockAttachedToBearingGUID": null, "SuspensionSecondBaseGUID": null, "PistonSecondBaseRefGUID": null, "SavedAnchor": {"x": 0, "y": 0, "z": 0}, "RelativePosition": {"x": 0, "y": 0, "z": 0}, "RelativeRotation": {"x": 0, "y": 0, "z": 0, "w": 0}};
function refreshRoots(){const o=$('root');o.replaceChildren(...roots().map((_,i)=>new Option(rlabel(i),i)));o.value=rootIdx}
function physOn(){const R=roots(),src=R[rootIdx];if(rootIdx!==0){msg(hh(62)+' ✗','bad');return}
  const bl=src.Multiblocks||[],sb=selBl(),pool=(sb.length?sb:bl).filter(isSimple);if(!pool.length){msg(hh(62)+' ✗','bad');return}
  const st=bsize(),mn=[1e18,1e18,1e18];for(const b of pool)['x','y','z'].forEach((k,i)=>{if(b.Position[k]<mn[i])mn[i]=b.Position[k]});
  const corner=mn.map(v=>v-st/2),root=structuredClone(DTPL),set=new Set(pool);
  root.GUID=uid();root.Origin=src.Origin??null;root.Position=tpos(corner);root.Rotation={x:0,y:0,z:0,w:1};root.Mass=pool.length;
  src.Multiblocks=bl.filter(b=>!set.has(b));
  for(const b of pool){b.Position=tpos([b.Position.x-corner[0],b.Position.y-corner[1],b.Position.z-corner[2]]);b.IsGrounded=false}
  root.Multiblocks=pool;(S.save.DynamicRoots=S.save.DynamicRoots||[]).push(root);
  sel=-1;ms=new Set();refreshRoots();list();$('edCard').hidden=true;touch();draw3();msg(hh(61)+': '+hh(62)+' → '+rlabel(roots().length-1),'ok')}
function physOff(){const R=roots(),src=R[rootIdx];if(rootIdx===0||src.Joint||(src.Bearings||[]).length){msg(hh(64)+' ✗','bad');return}
  const sb=selBl(),pool=sb.length?sb:src.Multiblocks.slice(),q=src.Rotation||{x:0,y:0,z:0,w:1},P=src.Position,set=new Set(pool);
  for(const b of pool){const v=qrot(q,[b.Position.x,b.Position.y,b.Position.z]);b.Position=tpos([P.x+v[0],P.y+v[1],P.z+v[2]]);b.Rotation=qmul(q,b.Rotation||{});b.IsGrounded=true;R[0].Multiblocks.push(b)}
  src.Multiblocks=src.Multiblocks.filter(b=>!set.has(b));
  if(!src.Multiblocks.length){S.save.DynamicRoots.splice(rootIdx-1,1);rootIdx=0}
  sel=-1;ms=new Set();refreshRoots();list();$('edCard').hidden=true;touch();draw3();msg(hh(61)+': '+hh(64),'ok')}
$('phon').onclick=physOn;$('phoff').onclick=physOff;


/* Картинка → блоки */
let imgEl=null;
const IW=()=>Math.max(4,Math.min(400,parseInt($('iw').value)||32));
function imgGrid(){if(!imgEl)return null;const W=IW(),H=Math.max(1,Math.round(W*imgEl.naturalHeight/imgEl.naturalWidth)),c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(imgEl,0,0,W,H);
  const d=g.getImageData(0,0,W,H).data,skip=$('isw').checked,fl=$('ifl').checked,px=[];
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=(j*W+i)*4,r=d[k],gg=d[k+1],b=d[k+2];if(d[k+3]<128||(skip&&r>235&&gg>235&&b>235))continue;px.push({i:fl?W-1-i:i,j,r:r/255,g:gg/255,b:b/255})}
  return{W,H,px}}
function imgPreview(){const G=imgGrid();if(!G){$('icnt').textContent='';return null}
  $('icnt').textContent=hh(23)+': '+G.px.length+(G.px.length>20000?' — '+hh(24):'');
  const c=$('ipv');c.width=G.W;c.height=G.H;const g=c.getContext('2d');g.clearRect(0,0,G.W,G.H);
  for(const p of G.px){g.fillStyle='rgb('+Math.round(p.r*255)+','+Math.round(p.g*255)+','+Math.round(p.b*255)+')';g.fillRect(p.i,p.j,1,1)}return G}
function imgBuild(){const G=imgPreview();if(!G||!G.px.length||!big(G.px.length))return;
  const st=bsize(),pl=$('ipl').value,sn=v=>Math.floor(v/st)*st+st/2,hw=Math.floor(G.W/2)*st,hh2=Math.floor(G.H/2)*st,bx=sn(cam.tx),by=sn(cam.ty),bz=sn(cam.tz),r=roots()[rootIdx],type=+$('ibt').value,f0=mbs().length;
  snap();
  for(const p of G.px){const u=p.i*st-hw,v=(G.H-1-p.j)*st-hh2,pos=pl==='xy'?[bx+u,by+v,bz]:pl==='xz'?[bx+u,by,bz+v]:[bx,by+v,bz+u];
    const b=structuredClone(TPL);b.GUID=uid();b.Origin=r.Origin??null;b.ItemType=type;b.IsGrounded=rootIdx===0;b.Rotation={x:0,y:0,z:0,w:1};
    b.Position={x:+pos[0].toFixed(4),y:+pos[1].toFixed(4),z:+pos[2].toFixed(4)};b.Colors=[{r:p.r,g:p.g,b:p.b,a:1}];mbs().push(b)}
  ms=new Set(G.px.map((_,k)=>f0+k));sel=mbs().length-1;fit();sel=-1;ms=new Set();after()}
$('ibt').replaceChildren(...[43,0,1,2,3,103].map(t=>new Option(NAMES[t],t)));
$('imgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{imgEl=im;URL.revokeObjectURL(u);imgPreview()};im.src=u};
['iw','isw','ifl'].forEach(id=>{$(id).onchange=imgPreview});$('ibuild').onclick=imgBuild;
setTheme();applyI18n();
