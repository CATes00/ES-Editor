<script>
/* Минимальный LZMA: полный декодер + кодер только из литералов (без поиска совпадений) */
function lzmaDecode(props,src,usize){
  let b=props[0],lc=b%9;b=(b/9)|0;const lp=b%5,pb=(b/5)|0;
  const mk=n=>new Uint16Array(n).fill(1024);
  const IsMatch=mk(192),IsRep=mk(12),G0=mk(12),G1=mk(12),G2=mk(12),R0L=mk(192);
  const Slot=[mk(64),mk(64),mk(64),mk(64)],Pos=mk(115),Align=mk(16),Lit=mk(0x300<<(lc+lp));
  const mkLen=()=>({c:mk(1),c2:mk(1),lo:Array.from({length:16},()=>mk(8)),mi:Array.from({length:16},()=>mk(8)),hi:mk(256)});
  const LenD=mkLen(),RepD=mkLen();
  let ip=5,range=0xFFFFFFFF,code=((src[1]<<24)|(src[2]<<16)|(src[3]<<8)|src[4])>>>0;
  const norm=()=>{if(range<0x1000000){range=(range<<8)>>>0;code=((code<<8)|(src[ip++]||0))>>>0}};
  const bit=(p,i)=>{const v=p[i],bd=(range>>>11)*v;let r;
    if(code<bd){range=bd;p[i]=v+((2048-v)>>5);r=0}else{range-=bd;code-=bd;p[i]=v-(v>>5);r=1}norm();return r};
  const tree=(p,n,o=0)=>{let m=1;for(let i=0;i<n;i++)m=(m<<1)|bit(p,o+m);return m-(1<<n)};
  const rtree=(p,n,o=0)=>{let m=1,s=0;for(let i=0;i<n;i++){const x=bit(p,o+m);m=(m<<1)|x;s|=x<<i}return s};
  const direct=n=>{let r=0;for(let i=0;i<n;i++){range>>>=1;code=(code-range)>>>0;const t=(code>>>31)?1:0;if(t)code=(code+range)>>>0;norm();r=((r<<1)|(t?0:1))>>>0}return r};
  const len=(d,ps)=>{if(!bit(d.c,0))return tree(d.lo[ps],3);if(!bit(d.c2,0))return 8+tree(d.mi[ps],3);return 16+tree(d.hi,8)};
  const out=new Uint8Array(usize);let pos=0,st=0,r0=0,r1=0,r2=0,r3=0;
  while(pos<usize){
    const ps=pos&((1<<pb)-1);
    if(!bit(IsMatch,(st<<4)+ps)){
      const prev=pos?out[pos-1]:0,base=0x300*(((pos&((1<<lp)-1))<<lc)+(prev>>(8-lc)));let s=1;
      if(st>=7){let mb=out[pos-r0-1];do{const m=(mb>>7)&1;mb<<=1;const x=bit(Lit,base+((1+m)<<8)+s);s=(s<<1)|x;if(m!==x)break}while(s<0x100)}
      while(s<0x100)s=(s<<1)|bit(Lit,base+s);
      out[pos++]=s&255;st=st<4?0:st<10?st-3:st-6;continue}
    let L;
    if(!bit(IsRep,st)){
      r3=r2;r2=r1;r1=r0;L=len(LenD,ps);st=st<7?7:10;
      const ls=L<4?L:3,slot=tree(Slot[ls],6);
      if(slot<4)r0=slot;else{const nb=(slot>>1)-1;let d=((2|(slot&1))<<nb)>>>0;
        if(slot<14)d+=rtree(Pos,nb,d-slot);else{d=(d+(direct(nb-4)<<4))>>>0;d=(d+rtree(Align,4))>>>0}r0=d>>>0}
      if(r0===0xFFFFFFFF)break;
    }else{
      if(!pos)throw new Error('LZMA: битый поток');
      if(!bit(G0,st)){if(!bit(R0L,(st<<4)+ps)){st=st<7?9:11;out[pos]=out[pos-r0-1];pos++;continue}}
      else{let d;if(!bit(G1,st))d=r1;else{if(!bit(G2,st))d=r2;else{d=r3;r3=r2}r2=r1}r1=r0;r0=d}
      L=len(RepD,ps);st=st<7?8:11}
    L+=2;if(r0>=pos)throw new Error('LZMA: битая ссылка');
    for(let i=0;i<L&&pos<usize;i++){out[pos]=out[pos-r0-1];pos++}
  }
  return out;
}
/* Кодер: каждый байт — литерал (lc=3, lp=0, pb=2). Файл получается чуть больше оригинала, но валидный. */
function lzmaEncodeLiterals(data){
  const out=[];let low=0,range=0xFFFFFFFF,cache=0,cs=1;
  const shift=()=>{if(low<0xFF000000||low>=0x100000000){const c=low>=0x100000000?1:0;let t=cache;do{out.push((t+c)&255);t=0xFF}while(--cs!==0);cache=Math.floor(low/0x1000000)&255}cs++;low=(low%0x1000000)*256};
  const enc=(p,i,b)=>{const v=p[i],bd=(range>>>11)*v;
    if(!b){range=bd;p[i]=v+((2048-v)>>5)}else{low+=bd;range-=bd;p[i]=v-(v>>5)}
    while(range<0x1000000){range=(range<<8)>>>0;shift()}};
  const IsMatch=new Uint16Array(192).fill(1024),Lit=new Uint16Array(0x300<<3).fill(1024);
  for(let pos=0;pos<data.length;pos++){
    enc(IsMatch,pos&3,0);
    const prev=pos?data[pos-1]:0,base=0x300*(prev>>5),c=data[pos];let s=1;
    for(let i=7;i>=0;i--){const b=(c>>i)&1;enc(Lit,base+s,b);s=(s<<1)|b}
  }
  for(let i=0;i<5;i++)shift();
  return Uint8Array.from(out);
}

/* ETSAVE7: чтение/запись (порт read_v7.py / write_v7.py от разработчика) */
const MISSING=Symbol('missing');
function guidStr(b){const h=i=>b[i].toString(16).padStart(2,'0');
  return h(3)+h(2)+h(1)+h(0)+'-'+h(5)+h(4)+'-'+h(7)+h(6)+'-'+h(8)+h(9)+'-'+h(10)+h(11)+h(12)+h(13)+h(14)+h(15)}
function guidBytes(s){const x=s.replace(/-/g,'');const b=[];for(let i=0;i<32;i+=2)b.push(parseInt(x.substr(i,2),16));
  return [b[3],b[2],b[1],b[0],b[5],b[4],b[7],b[6],...b.slice(8)]}
class Reader{
  constructor(raw){this.d=raw;this.p=0;this.dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);this.prev=0;this.grid=[0,0,0];this.desc=true}
  take(n){if(this.p+n>this.d.length)throw new Error('Файл оборван');const r=this.d.subarray(this.p,this.p+n);this.p+=n;return r}
  byte(){return this.take(1)[0]}
  uint(limit=Infinity){let v=0,m=1;for(let i=0;i<10;i++){const b=this.byte();v+=(b&127)*m;m*=128;if(b<128){if(v>limit)throw new Error('Превышен лимит');return v}}throw new Error('Плохой varint')}
  signed(){const n=this.uint();return n%2===0?n/2:-(n-1)/2-1}
  read(){
    const stable=this.byte();if(stable>1)throw new Error('Неизвестный режим ссылок');
    const count=this.uint(4e6);this.refs=[];
    if(stable){for(let i=0;i<count;i++)this.refs.push(guidStr(this.take(16)))}
    else{const seed=Uint8Array.from(this.take(16));const sv=new DataView(seed.buffer);const o=sv.getUint32(0,true);
      for(let i=0;i<count;i++){sv.setUint32(0,(o^i)>>>0,true);this.refs.push(guidStr(seed))}}
    const dec=new TextDecoder();
    const ns=this.uint(4e6);this.strings=[];for(let i=0;i<ns;i++)this.strings.push(dec.decode(this.take(this.uint(32<<20))));
    const nsh=this.uint(4096);this.shapes=[];
    for(let i=0;i<nsh;i++){const nf=this.uint(2048),sh=[];for(let j=0;j<nf;j++)sh.push(this.strings[this.uint(this.strings.length-1)]);this.shapes.push(sh)}
    const np=this.uint(4096);this.palette=[];for(let i=0;i<np;i++)this.palette.push(this.value());
    this.defaults=this.shapes.map(sh=>sh.map(()=>this.byte()?this.value():MISSING));
    this.desc=false;const res=this.value();
    if(this.p<this.d.length)throw new Error('Лишние данные в конце');return res}
  mask(s){const n=this.shapes[s].length,m=this.take((n+7)>>3);return Array.from({length:n},(_,i)=>!!(m[i>>3]&(1<<(i&7))))}
  def(s,f){const v=this.defaults[s][f];if(v===MISSING)throw new Error('Нет значения по умолчанию');return structuredClone(v)}
  value(depth=0){
    if(depth>128)throw new Error('Слишком глубоко');
    const t=this.byte();
    switch(t){
      case 0:return null;case 1:return false;case 2:return true;case 3:return this.signed();
      case 4:return this.dv.getFloat64((this.p+=8)-8,true);
      case 6:return this.strings[this.uint(this.strings.length-1)];
      case 14:return this.dv.getFloat32((this.p+=4)-4,true);
      case 18:return this.uint();
      case 17:{const q=this.take(16),dv=new DataView(q.buffer,q.byteOffset,16);
        const c=BigInt(dv.getUint32(0,true))|BigInt(dv.getUint32(4,true))<<32n|BigInt(dv.getUint32(8,true))<<64n,fl=dv.getUint32(12,true);
        return Number(c)*(fl>>>31?-1:1)/10**((fl>>>16)&255)}
      case 16:{this.prev+=this.signed();if(this.prev<0||this.prev>=this.refs.length)throw new Error('Плохая ссылка');return this.refs[this.prev]}
      case 12:{if(this.desc)throw new Error('Рекурсия палитры');return structuredClone(this.palette[this.uint(this.palette.length-1)])}
      case 13:{const s=this.uint(this.shapes.length-1),ty=this.byte(),r={};
        this.shapes[s].forEach((k,i)=>{this.grid[i]+=this.signed();r[k]=(ty&(1<<i))?this.grid[i]/4:Math.floor(this.grid[i]/4)});return r}
      case 8:{const s=this.uint(this.shapes.length-1),sh=this.shapes[s],m=this.desc?sh.map(()=>true):this.mask(s),r={};
        sh.forEach((k,i)=>{r[k]=m[i]?this.value(depth+1):this.def(s,i)});return r}
      case 7:{const n=this.uint(4e6),r=[];
        while(r.length<n){const col=this.byte(),b=this.uint(4096);
          if(col>1||b<1||b>n-r.length)throw new Error('Плохой пакет массива');
          if(!col){for(let i=0;i<b;i++)r.push(this.value(depth+1))}
          else{if(this.desc)throw new Error('Колонки в дескрипторе');const s=this.uint(this.shapes.length-1),sh=this.shapes[s];
            const ms=Array.from({length:b},()=>this.mask(s)),rows=Array.from({length:b},()=>({}));
            sh.forEach((k,f)=>{ms.forEach((m,j)=>{rows[j][k]=m[f]?this.value(depth+1):this.def(s,f)})});r.push(...rows)}}
        return r}
      default:throw new Error('Неизвестный тег '+t)}
  }
}
class Writer{
  constructor(){this.strings=new Map();this.shapes=new Map();this.out=[]}
  put(...a){for(const x of a){if(typeof x==='number')this.out.push(x);else for(const y of x)this.out.push(y)}}
  uint(v){v=BigInt(v);while(v>=128n){this.out.push(Number(v&127n)|128);v>>=7n}this.out.push(Number(v))}
  intern(s){if(!this.strings.has(s))this.strings.set(s,this.strings.size)}
  collect(v,d=0){
    if(d>128)throw new Error('Слишком глубоко');
    if(v===null||typeof v==='boolean'||typeof v==='number')return;
    if(typeof v==='string')return this.intern(v);
    if(Array.isArray(v)){v.forEach(c=>this.collect(c,d+1));return}
    if(typeof v==='object'){const sh=Object.keys(v).sort().join('\u0000');const keys=Object.keys(v).sort();
      if(!this.shapes.has(sh)){this.shapes.set(sh,{id:this.shapes.size,keys});keys.forEach(k=>this.intern(k))}
      Object.values(v).forEach(c=>this.collect(c,d+1));return}
    throw new Error('Неподдерживаемое значение')}
  value(v){
    if(v===null)this.put(0);
    else if(typeof v==='boolean')this.put(v?2:1);
    else if(typeof v==='number'){
      if(Number.isInteger(v)&&Math.abs(v)<2**53){this.put(3);this.uint(v>=0?v*2:-v*2-1)}
      else{this.put(4);const b=new Uint8Array(8);new DataView(b.buffer).setFloat64(0,v,true);this.put(b)}}
    else if(typeof v==='string'){this.put(6);this.uint(this.strings.get(v))}
    else if(Array.isArray(v)){this.put(7);this.uint(v.length);
      for(let s=0;s<v.length;s+=4096){const c=Math.min(4096,v.length-s);this.put(0);this.uint(c);for(let i=s;i<s+c;i++)this.value(v[i])}}
    else{const keys=Object.keys(v).sort(),sh=this.shapes.get(keys.join('\u0000'));
      this.put(8);this.uint(sh.id);
      const m=new Array((keys.length+7)>>3).fill(255);if(keys.length%8)m[m.length-1]=(1<<(keys.length%8))-1;
      this.put(m);keys.forEach(k=>this.value(v[k]))}}
  write(v){
    this.collect(v);this.put(1,0);this.uint(this.strings.size);
    const enc=new TextEncoder();
    for(const s of this.strings.keys()){const e=enc.encode(s);this.uint(e.length);this.put(e)}
    this.uint(this.shapes.size);
    for(const {keys} of this.shapes.values()){this.uint(keys.length);keys.forEach(k=>this.uint(this.strings.get(k)))}
    this.uint(0);
    for(const {keys} of this.shapes.values())this.put(new Array(keys.length).fill(0));
    this.value(v);return Uint8Array.from(this.out)}
}
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function readSave(buf){
  const m=String.fromCharCode(...buf.slice(0,7));if(m!=='ETSAVE7'||buf[7]!==0)throw new Error('Это не файл ETSAVE7');
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  const h={schema:buf[8],codec:buf[9],kind:buf[10],flags:buf[11],size:dv.getInt32(12,true),csize:dv.getInt32(16,true),crc:dv.getUint32(20,true),props:buf.slice(24,29)};
  if(h.schema!==1||h.codec!==1||h.flags||h.csize!==buf.length-29)throw new Error('Неподдерживаемый заголовок');
  const raw=lzmaDecode(h.props,buf.subarray(29),h.size);
  if(crc32(raw)!==h.crc)throw new Error('CRC не совпал');
  return {save:new Reader(raw).read(),kind:h.kind,raw};
}
function writeSave(save,kind=1){
  const raw=new Writer().write({...save,Version:7});
  const pl=lzmaEncodeLiterals(raw),out=new Uint8Array(29+pl.length),dv=new DataView(out.buffer);
  out.set([69,84,83,65,86,69,55,0,1,1,kind,0],0);dv.setInt32(12,raw.length,true);dv.setInt32(16,pl.length,true);dv.setUint32(20,crc32(raw),true);
  out.set([0x5d,0,0,1,0],24);out.set(pl,29);return out}

const $=id=>document.getElementById(id);
let S=null,rootIdx=0,sel=-1,built=null,dirty=false;
const status=(t,c)=>{$('status').textContent=t;$('status').className=c||'mut'};
const msg=(t,c)=>{$('msg').textContent=t;$('msg').className=c||'mut'};
const nm=t=>NAMES[t]||('#'+t);
const roots=()=>[S.save.GroundRoot,...(S.save.DynamicRoots||[])];
const rlabel=i=>i===0?'Земля (GroundRoot)':'Динамическая группа '+i+' ('+(roots()[i].Multiblocks||[]).length+' бл.)';

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const r=readSave(new Uint8Array(await f.arrayBuffer()));S={save:r.save,kind:r.kind,name:f.name};start(f.name+': прочитано')}
  catch(err){status('Ошибка: '+err.message,'bad')}};
$('jf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{S={save:JSON.parse(await f.text()),kind:1,name:f.name.replace(/\.json$/,'.etsave7')};start('JSON загружен')}catch(err){status('Ошибка JSON: '+err.message,'bad')}};
function start(t){built=null;dirty=false;setBtns();msg('');status(t,'ok');$('app').hidden=false;rootIdx=0;sel=-1;
  $('root').replaceChildren(...roots().map((_,i)=>new Option(rlabel(i),i)));$('root').value=0;
  $('world').replaceChildren();gen($('world'),S.save,['MapName','CustomMapName','UseDefaultSpawn','PlayerPosition','PlayerRotation','InDriverSeat']);
  list();$('edCard').hidden=true;rootForm()}
$('root').onchange=()=>{rootIdx=+$('root').value;sel=-1;list();$('edCard').hidden=true;rootForm()};
$('q').oninput=list;

function list(){
  const bl=roots()[rootIdx].Multiblocks||[],q=$('q').value.toLowerCase(),box=$('list');box.replaceChildren();let n=0;
  bl.forEach((b,i)=>{const t=nm(b.ItemType);if(q&&!t.toLowerCase().includes(q))return;n++;
    const d=document.createElement('div');d.className='it'+(i===sel?' sel':'');
    const p=b.Position||{};d.innerHTML='<span></span><span class="mut"></span>';
    d.children[0].textContent=i+'. '+t;d.children[1].textContent=[p.x,p.y,p.z].map(v=>typeof v==='number'?+v.toFixed(2):v).join(' ');
    d.onclick=()=>{sel=i;list();edit()};box.appendChild(d)});
  $('cnt').textContent='('+n+' из '+bl.length+')'}

function edit(){
  const b=roots()[rootIdx].Multiblocks[sel],ed=$('ed');ed.replaceChildren();$('edCard').hidden=false;
  $('edT').textContent=sel+'. '+nm(b.ItemType)+' (ItemType '+b.ItemType+')';
  gen(ed,b,['ItemType','IsGrounded','HalfCubeMask','Position','Rotation']);
  (b.Colors||[]).forEach((c,i)=>ed.appendChild(colorRow(c,'Цвет '+(i+1))));
  const skip=new Set(['Origin','GUID','ItemType','IsGrounded','HalfCubeMask','Position','Rotation','Colors']);
  const keys=Object.keys(b).filter(k=>!skip.has(k)&&b[k]!==null&&!(Array.isArray(b[k])&&!b[k].length));
  gen(ed,b,keys);
  const g=document.createElement('div');g.className='mut';g.textContent='GUID: '+b.GUID;ed.appendChild(g);
}
function rootForm(){const r=roots()[rootIdx],box=$('rootEd');box.replaceChildren();
  gen(box,r,Object.keys(r).filter(k=>!['Multiblocks','Bearings','Origin','GUID'].includes(k)&&r[k]!==null&&!(Array.isArray(r[k])&&!r[k].length)))}

const h2x=v=>{v=Math.max(0,Math.min(1,v));return Math.round(v*255).toString(16).padStart(2,'0')};
function colorRow(c,label){
  const d=document.createElement('div');d.className='f';const l=document.createElement('span');l.textContent=label;
  const w=document.createElement('div');w.className='row';
  const i=document.createElement('input');i.type='color';i.value='#'+h2x(c.r)+h2x(c.g)+h2x(c.b);
  i.oninput=()=>{const v=i.value;c.r=parseInt(v.substr(1,2),16)/255;c.g=parseInt(v.substr(3,2),16)/255;c.b=parseInt(v.substr(5,2),16)/255};
  const a=document.createElement('input');a.type='number';a.step='any';a.min=0;a.max=1;a.value=c.a;a.style.width='80px';a.title='прозрачность (alpha)';
  a.onchange=()=>{c.a=parseFloat(a.value)};w.append(i,a);d.append(l,w);return d}

/* универсальная форма: числа, флажки, строки, вложенные объекты, массивы (как JSON) */
function gen(box,obj,keys){
  for(const k of keys){const v=obj[k];if(v===undefined||v===null)continue;
    if(typeof v==='object'&&!Array.isArray(v)){const fs=document.createElement('fieldset'),lg=document.createElement('legend');lg.textContent=k;fs.appendChild(lg);
      gen(fs,v,Object.keys(v));box.appendChild(fs);continue}
    const d=document.createElement('div');d.className='f';const l=document.createElement('span');l.textContent=k;let i;
    if(typeof v==='boolean'){i=document.createElement('input');i.type='checkbox';i.checked=v;i.onchange=()=>{obj[k]=i.checked}}
    else if(typeof v==='number'){i=document.createElement('input');i.type='number';i.step='any';i.value=v;i.onchange=()=>{const x=parseFloat(i.value);if(!isNaN(x))obj[k]=x}}
    else if(typeof v==='string'){i=document.createElement('input');i.type='text';i.value=v;i.onchange=()=>{obj[k]=i.value}}
    else{i=document.createElement('input');i.type='text';i.value=JSON.stringify(v);i.onchange=()=>{try{obj[k]=JSON.parse(i.value);i.style.borderColor=''}catch{i.style.borderColor='var(--bad)'}}}
    d.append(l,i);box.appendChild(d)}}

function dl(bytes,fn){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes]));a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function setBtns(){$('dl').disabled=!built||dirty;$('sv').textContent=dirty?'Сохранить изменения •':'Сохранить изменения'}
$('app').addEventListener('change',()=>{if(built){dirty=true;setBtns();msg('Есть несохранённые изменения: нажми «Сохранить изменения».')}});
$('sv').onclick=()=>{try{built=writeSave(S.save,S.kind);dirty=false;setBtns();msg('Изменения сохранены ('+built.length+' Б). Теперь можно скачать файл.','ok')}catch(e){msg('Ошибка: '+e.message,'bad')}};
$('dl').onclick=async()=>{
  const name=S.name.replace(/(\.etsave7)?$/,'_edited.etsave7');
  if(window.showSaveFilePicker){
    try{const fh=await showSaveFilePicker({suggestedName:name,types:[{description:'Сохранение Evertech',accept:{'application/octet-stream':['.etsave7']}}]});
      const w=await fh.createWritable();await w.write(built);await w.close();msg('Файл сохранён: '+fh.name+'. Проверь его в игре (оригинал оставь копией).','ok');return}
    catch(e){if(e.name==='AbortError'){msg('Сохранение отменено');return}}
  }
  dl(built,name);msg('Файл скачан в папку загрузок: выбор папки в этом браузере недоступен, перенеси файл вручную.','ok')};
$('dlj').onclick=()=>dl(JSON.stringify(S.save,null,2),S.name.replace(/\.etsave7$/,'')+'.json');
</script>
</body>
</html>
